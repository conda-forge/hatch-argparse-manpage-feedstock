schema_version: 1

context:
  version: "1.0.3"

package:
  name: hatch-argparse-manpage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hatch-argparse-manpage/hatch_argparse_manpage-${{ version }}.tar.gz
  sha256: 8d77ff8991e80195858561e885a2f5783c884542930986f10829dd23bd342a80

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - rich
    - argparse-manpage >=4.8
    - hatchling

tests:
  - python:
      imports:
        - hatch_argparse_manpage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Hatch build hook plugin to generate manual pages
  license: GPL-3.0-only
  license_file: LICENSE.txt
  homepage: https://github.com/damonlynch/hatch-argparse-manpage
  documentation: https://github.com/damonlynch/hatch-argparse-manpage

extra:
  recipe-maintainers:
    - thewchan
